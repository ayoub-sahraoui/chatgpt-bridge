name: Build extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Package production extension
        run: npm run zip

      - name: Package development extension
        run: npm run zip -- --mode development

      - name: Upload production ZIP
        uses: actions/upload-artifact@v7
        with:
          path: .output/*-chrome.zip
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload development ZIP
        uses: actions/upload-artifact@v7
        with:
          path: .output/*-chrome-dev.zip
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
