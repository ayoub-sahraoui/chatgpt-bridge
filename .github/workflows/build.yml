name: Build extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Chrome extension
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must match package version v${version}`);
          }
          NODE

      - name: Package production extension
        run: npm run zip

      - name: Package development extension
        run: npm run zip -- --mode development

      - name: Upload production ZIP
        uses: actions/upload-artifact@v7
        with:
          path: .output/*-chrome.zip
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload development ZIP
        uses: actions/upload-artifact@v7
        with:
          path: .output/*-chrome-dev.zip
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download extension ZIPs
        uses: actions/download-artifact@v8
        with:
          pattern: chatgpt-bridge-*-chrome*.zip
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.zip \
            --verify-tag \
            --title "ChatGPT Bridge $RELEASE_TAG" \
            --generate-notes \
            --notes-file docs/release-notes.md
